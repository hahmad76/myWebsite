<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSHP Administration</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:1200px;margin:0 auto;padding:24px;background:#f6f7f9;color:#17202a}button,input{padding:10px;border:1px solid #ccd2d8;border-radius:6px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:white;padding:16px;border-radius:10px;box-shadow:0 1px 4px #0001;margin:12px 0}.hidden{display:none}.error{color:#a00}.row{display:flex;gap:8px;flex-wrap:wrap}.table{overflow:auto}.item{border-top:1px solid #eee;padding:12px 0}.verify{margin-top:8px}.verify button{margin-right:6px}.verified{color:#176b3a;font-weight:700}.rejected{color:#a00;font-weight:700}
    .new-submissions{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid #d00;color:#c00;padding:14px 16px;border-radius:10px;margin:12px 0;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0002}.new-submissions .badge{display:inline-flex;min-width:28px;height:28px;align-items:center;justify-content:center;border-radius:999px;background:#d00;color:#fff;font-weight:900;padding:0 8px}.new-submissions.blink{animation:sshpBlink 1s infinite}.new-submissions.read{animation:none;opacity:.75}@keyframes sshpBlink{0%,100%{opacity:1;box-shadow:0 2px 8px #0002}50%{opacity:.45;box-shadow:0 0 0 4px #d003}}
  </style>
</head>
<body>
  <h1>SCHOOLS SOLUTIONS HUB PAKISTAN</h1>
  <p>Administration Console</p>

  <section id="login" class="card">
    <h2>Administrator Login</h2>
    <form id="login-form" class="row">
      <input id="username" autocomplete="username" placeholder="Username" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button>Sign in</button>
    </form>
    <p id="login-message" class="error"></p>
  </section>

  <main id="dashboard" class="hidden">
    <div class="row"><strong id="identity"></strong><button id="logout">Sign out</button></div>
    <div id="new-submissions" class="new-submissions read" role="button" tabindex="0" title="Open new submissions and notifications">
      <span>🔴 NEW SUBMISSIONS</span><span id="new-submissions-count" class="badge">0</span>
    </div>
    <section class="grid" id="counts"></section>
    <section class="card">
      <h2>Notifications</h2><div id="notifications"></div>
    </section>
    <section class="card">
      <h2>Records</h2>
      <div class="row" id="collection-buttons"></div>
      <div id="records"></div>
    </section>
  </main>

<script>
(() => {
  const API = (window.SSHP_API_BASE || "/api").replace(/\/$/, "");
  let token = sessionStorage.getItem("sshp_admin_token") || "";
  let latestNotifications = [];
  const collections = ["serviceRequests","teacherInterests","schoolRequirements","contentSubmissions","submissions","quotes","orders","payments","announcements","resources"];
  const labels = Object.fromEntries(collections.map(x => [x, x.replace(/([A-Z])/g," $1").replace(/^./,x=>x.toUpperCase())]));
  const $ = id => document.getElementById(id);
  const api = async (path, options={}) => {
    options.headers = {...options.headers, ...(token ? {Authorization:`Bearer ${token}`} : {})};
    const r = await fetch(API + path, options);
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    return data;
  };
  const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  const renderCounts = counts => {
    $("counts").innerHTML = Object.entries(counts).map(([key,value]) => `<div class="card"><strong>${escapeHtml(labels[key] || key)}</strong><div>${value}</div></div>`).join("");
  };
  const renderRecords = (rows, collection) => {
    $("records").innerHTML = rows.length ? rows.map(row => {
      const paymentControls = collection === "payments" ? `<div class="verify"><strong>Status: ${escapeHtml(row.status || "")}</strong><br><button data-payment="${escapeHtml(row.id)}" data-status="verified">Verify Payment</button><button data-payment="${escapeHtml(row.id)}" data-status="rejected">Reject Payment</button></div>` : "";
      return `<div class="item"><strong>${escapeHtml(row.id || "")}</strong><pre>${escapeHtml(JSON.stringify(row,null,2))}</pre>${paymentControls}</div>`;
    }).join("") : "<p>No records.</p>";
    document.querySelectorAll("[data-payment]").forEach(button => button.onclick = async () => {
      const id=button.dataset.payment,status=button.dataset.status;
      if(!confirm(`${status === "verified" ? "Verify" : "Reject"} this payment?`)) return;
      try { await api(`/admin/collections/payments/${encodeURIComponent(id)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})}); const r=await api("/admin/collections/payments"); renderRecords(r.data,"payments"); await loadNotifications(); } catch(err) { alert(err.message); }
    });
  };
  function renderNewSubmissionAlert(){
    const unread = latestNotifications.filter(x => !x.read).length;
    $("new-submissions-count").textContent = unread;
    $("new-submissions").classList.toggle("blink", unread > 0);
    $("new-submissions").classList.toggle("read", unread === 0);
  }
  async function loadNotifications(){
    const n=await api("/admin/notifications");
    latestNotifications=n.data||[];
    $("notifications").innerHTML=latestNotifications.length?latestNotifications.map(x=>`<div class="item"><strong>${escapeHtml(x.title)}</strong><div>${escapeHtml(x.message)}</div><small>${x.read ? "Read" : "NEW"}</small></div>`).join(""):"<p>No notifications.</p>";
    renderNewSubmissionAlert();
  }
  async function markNotificationsRead(){
    const unread=latestNotifications.filter(x=>!x.read);
    for(const n of unread){
      try{await api(`/admin/collections/notifications/${encodeURIComponent(n.id)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({read:true})});}catch(err){console.warn(err);}
    }
    await loadNotifications();
  }
  async function openNewSubmissions(){
    try{
      await markNotificationsRead();
      const r=await api("/admin/collections/submissions");
      renderRecords(r.data,"submissions");
      document.getElementById("records").scrollIntoView({behavior:"smooth",block:"start"});
    }catch(err){alert(err.message);}
  }
  async function loadDashboard(){
    const result = await api("/admin/dashboard");
    $("login").classList.add("hidden"); $("dashboard").classList.remove("hidden");
    $("identity").textContent = "Signed in as administrator";
    renderCounts(result.data.counts);
    $("collection-buttons").innerHTML = collections.map(c => `<button data-c="${c}">${escapeHtml(labels[c])}</button>`).join("");
    document.querySelectorAll("#collection-buttons button").forEach(b => b.onclick = async () => { const r=await api(`/admin/collections/${b.dataset.c}`); renderRecords(r.data,b.dataset.c); });
    $("new-submissions").onclick=openNewSubmissions;
    $("new-submissions").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openNewSubmissions();}};
    await loadNotifications();
  }
  $("login-form").onsubmit = async e => { e.preventDefault(); $("login-message").textContent=""; try { const r=await api("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})}); token=r.data.token; sessionStorage.setItem("sshp_admin_token",token); await loadDashboard(); } catch(err){ $("login-message").textContent=err.message; } };
  $("logout").onclick = async () => { try { await api("/auth/logout",{method:"POST"}); } catch {} token=""; sessionStorage.removeItem("sshp_admin_token"); location.reload(); };
  if(token) loadDashboard().catch(() => { token=""; sessionStorage.removeItem("sshp_admin_token"); });
})();
</script>
</body>
</html>

name: Apply SSHP Online Services Menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-menu:
    if: ${{ !contains(github.event.head_commit.message, 'Add BISE Saidu Sharif Omni Challan menu') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add BISE Saidu Sharif Omni Challan menu
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<nav class="main-nav" aria-label="Main navigation"><a class="active" href="#top">Home</a><a href="#services">Online Services</a><a href="#careers">Careers</a><a href="#resources">Resources</a><a href="#updates">Updates</a><a href="#about">About</a><a class="nav-cta" href="#start">Get Started</a></nav>'
          new = '''<nav class="main-nav" aria-label="Main navigation">
            <div class="nav-item simple"><a class="active" href="#top">Home</a></div>
            <div class="nav-item has-menu">
              <a href="#services" aria-haspopup="true" onclick="event.preventDefault();this.parentElement.classList.toggle('menu-open')">Online Services</a>
              <div class="mega-menu" role="menu">
                <span class="mega-menu-title">ONLINE SERVICES &amp; ORDERS</span>
                <a role="menuitem" href="#payments"><strong>BISE Saidu Sharif Omni Challan Submission</strong><small>Submit BISE Saidu Sharif Swat challan through Omni 24/7</small></a>
                <a role="menuitem" href="#services">Educational Services</a>
                <a role="menuitem" href="#start">Submit a Service Request</a>
                <a role="menuitem" href="#payments">Omni Payment Reference Verification</a>
              </div>
            </div>
            <div class="nav-item simple"><a href="#careers">Careers</a></div>
            <div class="nav-item simple"><a href="#resources">Resources</a></div>
            <div class="nav-item simple"><a href="#updates">Updates</a></div>
            <div class="nav-item simple"><a href="#about">About</a></div>
            <div class="nav-item simple"><a class="nav-cta" href="#start">Get Started</a></div>
          </nav>'''
          if old not in s:
              raise SystemExit('Expected navigation markup was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit website change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add BISE Saidu Sharif Omni Challan menu"
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git rm .github/workflows/apply-online-services-menu.yml
          git commit -m "Remove temporary menu workflow"
          git push

name: Fix AdSense placement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Place AdSense code inside head
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          script = '''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8837115524897921"
               crossorigin="anonymous"></script>'''
          import re
          s = re.sub(r'\s*<script async src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-8837115524897921"\s*crossorigin="anonymous"></script>', '', s)
          if '</head>' not in s:
              raise SystemExit('No closing head tag found')
          s = s.replace('</head>', script + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit corrected index.html and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-adsense-placement.yml
          git rm .github/workflows/fix-adsense-placement.yml
          git commit -m "Place Google AdSense code inside head"
          git push